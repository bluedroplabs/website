  - type: FeaturedAccordionList
    title: "Frequently Asked Questions"
    items:
      - title: "Can you support multiple websites or environments?"
        content: "Yes. We regularly support clients with multiple sites, staging environments, and complex hosting setups — each one covered by the same direct-to-developer support model."
      - title: "Do you only work on Drupal and WordPress?"
        content: "Drupal and WordPress are our specialties, but our team also handles related technologies like custom APIs, headless front-ends, and third-party integrations."
      - title: "What if we already have an in-house developer?"
        content: "We often work alongside in-house teams to provide overflow capacity, deep CMS expertise, or emergency coverage when your developers need backup."
      - title: "Can you help migrate us to better hosting?"
        content: "Absolutely. We run a high-performance hosting platform optimized for Drupal and WordPress, and we handle migrations with zero downtime as part of the onboarding."
      - title: "Is there a minimum contract term?"
        content: "No. All of our support plans are month-to-month — stay because the service is working for you, not because you're locked in."

