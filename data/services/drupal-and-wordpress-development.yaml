  - type: FeaturedAccordionList
    title: "Frequently Asked Questions"
    items:
      - title: "What types of projects do you typically handle?"
        content: "We take on everything from small-scope feature work and custom module/plugin builds to enterprise-level integrations, performance and security overhauls, and full platform rebuilds on Drupal or WordPress."
      - title: "Do you only work with Drupal and WordPress?"
        content: "Those are our core specialties, but our team also works across the broader stack — custom APIs, headless front-ends, third-party integrations, and supporting infrastructure."
      - title: "How long does a typical development project take?"
        content: "It depends on scope. A focused integration or module build can ship in a few weeks, while larger platform projects typically run two to six months. We'll give you a concrete timeline after the Technical Assessment."
      - title: "Do you offer post-launch support or maintenance?"
        content: "Yes. Every engagement ends with a clean handoff, documentation, and optional ongoing support — either through our CMS Support plans or continued development work."
      - title: "Can you help fix issues with an existing website?"
        content: "Absolutely. We regularly step in to fix broken features, resolve performance issues, clean up inherited code, and finish stalled projects on existing Drupal and WordPress sites."

