# SEO + Marketing Configuration
# This file defines the /services/seo-and-marketing page

title: "SEO + Marketing"
description: "Turn your website into a high-performing business asset. Build lasting visibility and brand trust."
components:
  - type: DetailPageHero
    title: "SEO + Marketing"
    description: "Turn your website into a high-performing business asset. Build lasting visibility and brand trust."
    image:
      src: "/assets/seo-and-marketing-hero-light.png"
      srcDark: "/assets/seo-and-marketing-hero-dark.png"
      alt: "SEO + Marketing"
    primaryCTA:
      children: "Book a Strategy Call"
      href: "/contact"

  - type: FeaturedSplitIconList
    title: "Smarter Digital Marketing That Puts Your Business Goals First"
    items:
      - icon: "ChartIcon"
        title: "Sustainable Growth That Compounds"
        description: "We build long-term visibility through ethical SEO and high-quality content that continues to drive leads and traffic long after launch."
      - icon: "BoltIcon"
        title: "Performance That Converts"
        description: "Our work doesn't stop at visibility. We optimize for site speed, accessibility, and conversion flow to turn traffic into measurable business results."
      - icon: "CheckBadgeIcon"
        title: "Strategy Tailored to Your Business"
        description: "Every website has unique goals and audiences. We build a marketing strategy grounded in data, aligned with your objectives, and flexible as your business evolves."

  - type: FeaturedIconGrid
    eyebrow: "What Sets Us Apart"
    title: "Technical Expertise Meets Marketing Clarity"
    description: "Our team blends deep technical SEO knowledge with creative marketing strategy to ensure every optimization serves your business goals."
    variant: "inline"
    items:
      - icon: "CodeBlockIcon"
        title: "Full-Stack Understanding"
        description: "Our developers and marketers collaborate seamlessly so every SEO and content improvement is backed by technical precision."
      - icon: "ChartIcon"
        title: "Transparent, Data-Driven Approach"
        description: "You see exactly what's being done and why. Regular reports track progress toward KPIs that actually matter to your business."
      - icon: "DomainIcon"
        title: "Platform-Agnostic Optimization"
        description: "From WordPress and Drupal to headless CMS or custom sites, we work with your existing setup — no pressure to migrate."
      - icon: "ShakeHandsIcon"
        title: "Ongoing Partnership, Not Just a Project"
        description: "We stay with you after implementation continuously improving performance, content, and ROI as your business grows."

  - type: FeaturedServiceCategories
    eyebrow: "End-to-End Marketing"
    title: "Comprehensive Digital Growth Services"
    description: "From strategy to technical SEO, we optimize every part of your website to attract more visitors, convert more customers, and build lasting visibility no matter what platform you use."
    groups:
      - title: "Marketing Strategy and Positioning"
        description: "We help you define, refine, and communicate your brand message effectively across all digital touch points."
        items:
          - icon: "BrainIcon"
            title: "Brand Messaging Workshops"
            features:
              - "Discover your unique value proposition."
              - "Define clear positioning that differentiates you from competitors."
              - "Develop messaging that resonates with your target audience."
          - icon: "AccountTreeIcon"
            title: "Site Structure and Information Architecture"
            features:
              - "Optimize navigation for both users and search engines."
              - "Design user pathways that guide visitors to conversion."
              - "Create logical content hierarchies that boost SEO."
          - icon: "CodeBlockIcon"
            title: "Website Copywriting"
            features:
              - "Explain the value proposition efficiently and effectively"
              - "Communicate key brand strengths in a way that resonates with your audience."
              - "Improve conversion rates with targeted copy."
      - title: "Content Strategy"
        description: "Content is the foundation of effective SEO. We help you create and optimize content that drives visibility, engagement, and conversion."
        items:
          - icon: "DataIcon"
            title: "Content Audit & Gap Analysis"
            features:
              - "Evaluate existing content effectiveness."
              - "Identify topic opportunities based on search data."
              - "Map content to user journey stages."
          - icon: "ClockIcon"
            title: "Editorial Calendar Development"
            features:
              - "Brainstorm content ideas that can succeed in the AI Overviews landscape."
              - "Create sustainable content publishing schedules."
              - "Align content with business goals and seasonality."
          - icon: "StackedIcon"
            title: "Cornerstone Content Creation"
            features:
              - "Develop in-depth content on your core service areas."
              - "Create supplementary content for authoritative coverage of relevant topics."
              - "Optimize for competitive keywords with search volume."
      - title: "Technical SEO"
        description: "We handle the behind-the-scenes optimization that makes search engines love your site—clean code, fast load times, and flawless indexing."
        items:
          - icon: "BoltIcon"
            title: "Resolve Technical Issues"
            features:
              - "Achieve 95% Core Web Vitals scores on mobile and desktop."
              - "Fix canonical URL implementation and optimize URL pattern structures."
              - "Surface and address duplicate content."
          - icon: "SwapIcon"
            title: "Site Migration Support"
            features:
              - "Ensure all links and redirects are ready so you don't lose authority."
              - "Recommendations for content consolidation and pruning."
              - "Optimize when merging multiple domains into one website."
          - icon: "CodeBlockIcon"
            title: "Metatag Setup and Optimization"
            features:
              - "Add structured data markup (JSON-LD)"
              - "Increase rich snippet and AI-inclusion opportunities."
              - "Categorize content for inclusion in AI overviews and LLMs."
          - icon: "ShieldLockIcon"
            title: "GDPR Compliance"
            features:
              - "Implement cookie consent."
              - "Set up privacy-compliant analytics."
              - "Integrate with Google Tag Manager."
      - title: "Ongoing SEO and <br/> Performance"
        description: "Sustainable SEO requires consistent attention. Keep your site competitive in today's dynamic search landscape and never worry about your content pipeline."
        items:
          - icon: "DevUpdateIcon"
            title: "Content Marketing and Engineering"
            features:
              - "Distribute and repackage content for optimal reach."
              - "Update content quarterly to ensure freshness."
              - "Ideate and produce content regularly to build authority and traffic."
          - icon: "ChartIcon"
            title: "Analytics and Reporting"
            features:
              - "Create custom dashboards for your KPIs."
              - "Track conversions, not just rankings."
              - "Monitor search competition."
          - icon: "LinkIcon"
            title: "Backlink Acquisition"
            features:
              - "Outreach to websites relevant to your audience."
              - "Competitive backlink analysis to identify high-value opportunities."
              - "Regular follow-up and tracking."

  - type: FeaturedCtaBand
    variant: "centered"
    text: "Everything you need to grow <strong>visibility</strong>, <strong>performance</strong>, and <strong>conversions</strong> under one roof."

  - type: GridSeparator

  - type: FeaturedAccordionList
    title: "Frequently Asked Questions"
    items:
      - title: "How long does it take to see results?"
        content: "Most SEO and content engagements show early wins — technical fixes, indexation improvements, and content velocity — within the first 30 to 60 days. Ranking and conversion gains compound over 3–6 months of consistent work."
      - title: "Can you work alongside our in-house marketing or development team?"
        content: "Yes. We integrate directly with your team through Slack, shared docs, and your existing project tools, handling whatever layer of the work you need and staying out of the way for everything else."
      - title: "How do you measure success?"
        content: "We focus on metrics that matter to your business — qualified traffic, conversions, and revenue impact — not vanity rankings. Every engagement starts with agreeing on the KPIs and ends with a dashboard that tracks them."
      - title: "Do you handle paid campaigns (PPC, social, etc.)"
        content: "Our focus is organic growth — SEO, content, and conversion optimization. We partner with trusted paid-media specialists when a client needs PPC or paid social, and we make sure organic and paid strategies reinforce each other."
      - title: "What industries do you specialize in?"
        content: "We work primarily with B2B SaaS, professional services, publishers, and mission-driven organizations — anyone whose growth depends on content, trust, and long-term organic visibility."

  - type: GridSeparator
