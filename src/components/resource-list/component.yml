name: Resource List
machineName: resource-list
status: true
required:
  - listingType
props:
  properties:
    listingType:
      title: Listing type
      type: string
      enum:
        - resource
        - service
      meta:enum:
        resource: Resources
        service: Services
      examples:
        - resource
    limit:
      title: Items per page
      type: integer
      minimum: 1
      maximum: 50
      default: 10
    showFilters:
      title: Show filters
      type: boolean
      default: true
